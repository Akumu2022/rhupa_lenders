services:
  - type: web
    name: rhupa-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Runs pending Alembic migrations before every boot — the free plan has
    # no separate pre-deploy step, so this is the reliable place for it.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Set to your Neon/Supabase connection string after creating it —
      # never committed here (CLAUDE.md: secrets stay out of the repo).
      # The running app's connection: the RESTRICTED role rhupa_app, which
      # row-level security applies to (scripts/create_app_role.sql).
      - key: DATABASE_URL
        sync: false
      # Migrations only: the table OWNER (neondb_owner), which has DDL rights
      # but bypasses row-level security, so the app itself must not use it.
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "45"
      # Shared secret for the daily end-of-day job (.github/workflows/
      # end-of-day.yml). Set it here AND as the GitHub repository secret
      # CRON_SECRET, same value. Unset = the endpoint is disabled.
      - key: CRON_SECRET
        sync: false
      # Set to your deployed Vercel frontend URL, e.g.
      # https://rhupa-lenders.vercel.app (no trailing slash).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
