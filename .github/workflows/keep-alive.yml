# Keeps the Render free-plan backend awake so the bank's Collections API calls
# (and users) don't hit a 30-60 second cold start. Render sleeps a free service
# after ~15 minutes idle; this pings /health every 10 minutes.
#
# GitHub's scheduler can run late or skip a tick, so this reduces cold starts
# rather than guaranteeing none. The reliable fix is a paid Render plan, after
# which this workflow can simply be deleted.
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the backend
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 15 --retry-all-errors --max-time 90 \
            https://rhupa-backend.onrender.com/health
