# Runs on every push and pull request. Render and Vercel deploy straight
# from main, so this is the gate that keeps a broken change from reaching
# production unnoticed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches render.yaml PYTHON_VERSION
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  # The whole suite again on real Postgres, with row-level security FORCED on
  # every tenant table (tests/conftest.py). Any code path the database-level
  # tenant policies would block fails here before it can reach production.
  backend-tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rhupa
          POSTGRES_PASSWORD: rhupa
          POSTGRES_DB: rhupa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rhupa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rhupa:rhupa@localhost:5432/rhupa_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -x

  # The test suite runs on SQLite; production runs Postgres. Migrations are
  # the part most likely to behave differently between the two (enum types,
  # ALTER TABLE, constraints), so apply every one to a real Postgres.
  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rhupa
          POSTGRES_PASSWORD: rhupa
          POSTGRES_DB: rhupa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rhupa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rhupa:rhupa@localhost:5432/rhupa
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Downgrade one step and re-upgrade (latest migration is reversible)
        run: alembic downgrade -1 && alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
